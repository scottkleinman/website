                "text": {
                    "headline": "General Timeline for Early British Literature",
                    "text": "<p>This timeline is designed to give you an overview of the entire period covered by courses in early British Literature.</p>"
                }
            },
            "events": [{
                    "media": {
                        "url": "http://arthistoryteachingresources.org/wp-content/uploads/2014/08/Augustus-of-Primaporta-466x700.jpg",
                        "caption": "<strong>Augustus of Primaporta</strong>, Roman, 63 BCE – 14 CE",
                        "credit": "Credit: <a href='http://arthistoryteachingresources.org/lessons/ancient-roman-art/'>Art History Teach Resources</a>"
                    },
                    "display_date": "",
                    "start_date": {
                        "year": "-800"
                    },
                    "text": {
                        "headline": "The Classical Period<br/> 800 BCE - 500 CE",
                        "text": "<p>Also referred to as Ancient Greece and Rome or Classical Antiquity, this period covers cultural developments around the Mediterranean Sea which gave rise to many of the features of Western Civilisation.</p>"
                    }
                },
                {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Kapitolinische_W%C3%B6lfin_Museum_Capitolini.jpg/1200px-Kapitolinische_W%C3%B6lfin_Museum_Capitolini.jpg",
                        "caption": "Romulus and Remus, mythological founders of Rome, suckled by a she-wolf.",
                        "credit": "Credit: <a href=\"https://commons.wikimedia.org/wiki/File:Kapitolinische_W%C3%B6lfin_Museum_Capitolini.jpg\">Wikimedia</a>"
                    },
                    "start_date": {
                        "year": "-753"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "Mythological founding of the city of Rome, 753 BCE",
                        "text": "According to legend, Romulus and Remus were princes left to die along the banks of the River Tiber, which runs through Rome. Famously, they were saved as infants by a she-wolf."
                    }
                },
                {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/7/7b/Via_dell%27Abbondanza_1.JPG",
                        "caption": "The Via dell'Abbondanza, the main street in the Roman spa town of Pompeii, destroyed by the eruption of Mount Vesuvius in 79 CE.",
                        "credit": "Credit: https://commons.wikimedia.org/wiki/File:Via_dell%27Abbondanza_1.JPG"
                    },
                    "start_date": {
                        "year": "-30"
                    },
                    "end_date": {
                        "year": "500"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "The Roman Empire<br/> 30 BCE - 500 CE",
                        "text": "Julius Caesar's conquest of Gaul (modern France and surrounding territories) paved the way for a massive expansion of Roman rule in subsequent centuries, exporting its language and culture across Western Europe, the Middle East, and North Africa."
                    }
                },
                {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/c/cc/Christ_treading_the_beasts_-_Chapel_of_Saint_Andrew_-_Ravenna_2016.jpg",
                        "caption": "Christ as Emperor, wearing military dress, and crushing the serpent representing Satan. Ravenna, after 500 CE.",
                        "credit": "Credit: Wikimedia https://commons.wikimedia.org/wiki/File:Christ_treading_the_beasts_-_Chapel_of_Saint_Andrew_-_Ravenna_2016.jpg"
                    },
                    "start_date": {
                        "year": "0"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "The Birth of Christ",
                        "text": "During the first centuries after the death of Christ, his followers spread throughout the Empire but were frequently subject to persecution. Many early Christian saints were victims of such persecution."
                    }
                },
                {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/0/00/Roman_Empire_Trajan_117AD.png/1200px-Roman_Empire_Trajan_117AD.png",
                        "caption": "The Roman Empire in 117 AD at its greatest extent, the time of Trajan's death (with its vassals in pink).",
                        "credit": "Credit: Wikimedia https://commons.wikimedia.org/wiki/File:Roman_Empire_Trajan_117AD.png"
                    },
                    "start_date": {
                        "year": "117"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "Expansion of the Roman Empire",
                        "text": "<p>By the second century CE, the Empire had spread to cover much of Britain, which was made a province called <em>Britannia</em> in Latin.</p>"
                    }
                },
                {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Sant%27Ambrogio_Cript_in_Basilica_of_Sant%27Ambrogio%2C_Milan.jpg/1200px-Sant%27Ambrogio_Cript_in_Basilica_of_Sant%27Ambrogio%2C_Milan.jpg",
                        "caption": "Saint Ambrose (fashionably dressed in white) with Saints Gervase and Protase. Basilica di Sant'Ambrogio, Milan.",
                        "credit": "Credit: Wikimedia https://commons.wikimedia.org/wiki/File:Sant%27Ambrogio_Cript_in_Basilica_of_Sant%27Ambrogio,_Milan.jpg"
                    },
                    "start_date": {
                        "year": "350"
                    },
                    "end_date": {
                        "year": "600"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "Christian Institutions Develop throughout the Empire<br>350 - 600",
                        "text": "<p>In 313, Emperor Constantine the Great legalised Christianity and later declared himself a Christian. Continued imperial patronage slowly led Christianity to eclipse rival cults (often incorporating their ideas and rituals) followed around the Empire.</p><p>This more permissive environment gave rise to the consolidation of Christian doctrines and practices by a number of important figures (often known as the Church Fathers) and by the development of the infrasture and institutions of the Church. Notable thinkers were Saint Ambrose, Bishop of Milan, Saint Augustine of Hippo, Saint Jerome (who translated the Bible into Latin), Pope Gregory the Great.</p>"
                    }
                },
                {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/Rome-Capitole-StatueConstantin.jpg/675px-Rome-Capitole-StatueConstantin.jpg",
                        "caption": "Colossal head of Constantine (4th century), Capitoline Museums, Rome.",
                        "credit": "Credit: Wikimedia https://commons.wikimedia.org/wiki/File:Rome-Capitole-StatueConstantin.jpg"
                    },
                    "start_date": {
                        "year": "380"
                    },
                    "text": {
                        "headline": "Christianity Becomes the Official Religion of the Roman Empire",
                        "text": "Although Christianity was made the official religion under Emperor Theodosius I at the end of the fourth century, Constantine the Great was credited with converting the Empire to Christianity. In the twelfth century, it was believed the Constantine's mother Helen was from Britain. Geoffrey of Monmouth, in his <em>Historia regum Britanniae</em> (History of the Kings of the Britons) made her the daughter of the British King Coel, possibly remembered today in the nursery rhyme \"Old King Cole\".</p>"
                    }
                },
                {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Mausoleum_of_Theoderic.JPG/1200px-Mausoleum_of_Theoderic.JPG",
                        "caption": "The Mausoleum of Theodoric in Ravenna",
                        "credit": "Credit: <a href='https://en.wikipedia.org/wiki/Theodoric_the_Great#/media/File:Mausoleum_of_Theoderic.JPG'>Wikimedia</a>"
                    },
                    "start_date": {
                        "year": "500"
                    },
                    "text": {
                        "headline": "The Fall of the Roman Empire",
                        "text": "<p>The difficulty of maintaining unified control over such a large territory sorely tested imperial rule. In 395 the Empire was divided into Eastern and Western Empires, with the eastern capitol at Constantinople (modern Istanbul, Turkey). Although nominally the same state, the Eastern Empire (later the Byzantine Empire, which would last until 1453) was effectively independent.</p><p>The Western Empire fell into disarray, particularly under pressure from Germanic peoples migrating from the East. In 493, Italy was conquered by Theodoric, King of the Ostrogoths, bringing about the end of the Western Roman Empire.</p><p>Whilst many Roman institutions quickly fell into disarray the Church preserved much Roman culture and literature, and continued to maintain Latin as the language of learning.</p>"
                    }
                },
                {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Cleric-Knight-Workman.jpg/330px-Cleric-Knight-Workman.jpg",
                        "caption": "Medieval French manuscript illustration of the three medieval estates: the <em>oratores</em> (\"those who pray\", the clergy), the <em>bellatores</em> (\"warriors\", the nobility), and the <em>laboratores</em> (\"labourers\", the peasantry). (<em>Li Livres dou Sante</em>, 13th century)",
                        "credit": "Credit: Wikimedia https://en.wikipedia.org/wiki/File:Cleric-Knight-Workman.jpg"
                    },
                    "start_date": {
                        "year": "500"
                    },
                    "end_date": {
                        "year": "1500"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "The Middle Ages<br>500 - 1500",
                        "text": "<p>The fall of the Roman Empire marks the beginning of the Middle Ages (the medieval period).</p><p>Things to remember:</p><ul><li>\"The Middle Ages\" should be in capital letters.</li><li>The adjective form is \"medieval\" (for instance \"medieval literature\", not \"Middle Age literature\").</li><li>The word \"medieval\" should be in lower case.</li>"
                    }
                },
                {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Anglo.Saxon.migration.5th.cen.jpg/1024px-Anglo.Saxon.migration.5th.cen.jpg",
                        "caption": "The Anglo-Saxon migration, 5th century.",
                        "credit": "Credit: Wikimedia https://en.wikipedia.org/wiki/Anglo-Saxons#/media/File:Anglo.Saxon.migration.5th.cen.jpg"
                    },
                    "start_date": {
                        "year": "410"
                    },
                    "end_date": {
                        "year": "600"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "Anglo-Saxon Migration",
                        "text": "<p>From the early fourth century to the end of the fifth, there was extension migration of Germanic settlers from multiple regions of what would be Denmark, Germany, and the Netherlands today. Although these peoples initially remained politically separate, they quickly developed a common cultural and linguistic identity distinct from that of their cousins on the Continent.</p>"
                    }
                },
                {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/6/6d/Sutton_Hoo_belt_buckle.jpg",
                        "caption": "Sutton Hoo gold belt buckle, early 7th century",
                        "credit": "Credit: Wikimedia https://commons.wikimedia.org/wiki/File:Sutton_Hoo_belt_buckle.jpg"
                    },
                    "start_date": {
                        "year": "625"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "Early Anglo-Saxon England",
                        "text": "<p>The Anglo-Saxons inherited aspects of early Germanic culture from their continental forebears, including paganism and poetic traditions. At the end of the sixth century, efforts by both Christian Britons and paper missionaries had begun to make inroads. By the early seventh century, there is evidence for the blending of Germanic and Christian traditions.</p><p>An example is the elaborate buried ship-burial at Sutton Hoo, Suffolk, which was probably created as the grave of King Rædwald of East Anglia, the first of the Anglo-Saxon kings to convert to Christianity."
                    }
                },
                {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/LindisfarneFol27rIncipitMatt.jpg/633px-LindisfarneFol27rIncipitMatt.jpg",
                        "caption": "Folio 27r from the Lindisfarne Gospels contains the incipit from the Gospel of Matthew.",
                        "credit": "Credit: Wikimedia https://en.wikipedia.org/wiki/File:LindisfarneFol27rIncipitMatt.jpg"
                    },
                    "start_date": {
                        "year": "705"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "The Growth of Christian Learning in Anglo-Saxon England",
                        "text": "<p>In the seventh century, especially in Northumbria, an active, Latinate, liteary culture grew as the Anglo-Saxon Church began to take shape through a network of bishropics, monasteries, and abbeys.</p>"
                    }
                },
                {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/8/89/E-codices_bke-0047_001v_medium.jpg/675px-E-codices_bke-0047_001v_medium.jpg",
                        "caption": "The Venerable Bede writing the <em>Historia ecclesiastica</em>, from a codex at Engelberg Abbey in Switzerland.",
                        "credit": "Credit: Wikimedia https://commons.wikimedia.org/wiki/File:E-codices_bke-0047_001v_medium.jpg"
                    },
                    "start_date": {
                        "year": "731"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "Bede<br>672/3-735",
                        "text": "<p>Bede's <em>Historia ecclesiastica gentis anglorum</em> (Ecclesiastical History of the English People), completed in 731, is the source for much of our knowledge of early Anglo-Saxon England.</p><p>Bede provides an account of the first named poet in the English language, Cædmon, and quotes <em>Cædmon's Hymn</em> in translation (the English text would only appear in the margins of copies of the <em>Historia</em> a few decades or so later.</p>"
                    }
                },
                {
                    "media": {
                        "url": "https://www.history.org.uk/library/1811/0000/0051/AngloSaxonEnglandmapc800AD.gif",
                        "caption": "The Anglo-Saxon Kingdoms, c. 800",
                        "credit": "Credit: history.org.uk https://www.history.org.uk/primary/resource/3865/anglo-saxons-a-brief-history"
                    },
                    "start_date": {
                        "year": "800"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "The Anglo-Saxon Kingdoms, c. 800",
                        "text": "<p>Although there were many kingdoms in early Anglo-Saxon England, over the centuries they began to consolidate with Northumbria, Mercia, and Wessex emerging as the most powerful. The country would not be united as a single kingdom of England until the middle of the tenth century.</p>.</p>"
                    }
                },
                {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/England_878.svg/723px-England_878.svg.png",
                        "caption": "The Anglo-Saxon Kingdoms and the Danelaw, c. 878",
                        "credit": "Credit: Wikimedia https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/England_878.svg/800px-England_878.svg.png"
                    },
                    "start_date": {
                        "year": "878"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "The Anglo-Saxon Kingdoms and the Danelaw, c. 878",
                        "text": "<p>In 787 the first of a sustained series of raids by Scandinavian invaders, known as the Vikings, but generally called the Danes by the Anglo-Saxons. Within a century, they had conquered and extensively settled much of eastern England and would later go on to wrest control of much of Northumbria.</p><p>Their advance was stopped by Alfred the Great, King of Wessex. Alfred believed that the Danish conquests had been a consequence of lost wisdom, which had only been preserved in Latin books. He began to encourage the teaching of reading and writing in English to make such wisdom more accessible. The program was probably interrupted by further Viking invasions after his death in 899, but it was successful enough that we have an increasing number of English texts surviving from the late ninth century on.</p>"
                    }
                },
                {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Beowulf_Cotton_MS_Vitellius_A_XV_f._132r.jpg/800px-Beowulf_Cotton_MS_Vitellius_A_XV_f._132r.jpg",
                        "caption": "The beginning of <em>Beowulf</em>",
                        "credit": "Credit: Wikimedia https://en.wikipedia.org/wiki/Beowulf#/media/File:Beowulf_Cotton_MS_Vitellius_A_XV_f._132r.jpg"
                    },
                    "start_date": {
                        "year": "1016"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "<em>Beowulf</em>",
                        "text": "<p>Perhaps the most famous work of Old English literature, <em>Beowulf</em> survives in a single manuscript, dating to about 1016. The poem itself may be much older, and its date of composition has been debated for over a century.</p>"
                    }
                },
                {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/bb/Bayeux_Tapestry_scene57_Harold_death.jpg/1024px-Bayeux_Tapestry_scene57_Harold_death.jpg",
                        "caption": "The Bayeux Tapestry's depiction of King Harold's death. Legend above: <em>Harold rex interfectus est</em> (King Harold is killed).",
                        "credit": "Credit: Wikimedia https://en.wikipedia.org/wiki/Bayeux_Tapestry#/media/File:Bayeux_Tapestry_scene57_Harold_death.jpg"
                    },
                    "start_date": {
                        "year": "1066"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "The Norman Conquest, 1066",
                        "text": "<p>William, Duke of Normandy, defeated King Harold at the Battle of Hastings, bringing an end to Anglo-Saxon England.</p>"
                    }
                }, {
                    "media": {
                        "url": "https://www.archives.gov/files/exhibits/featured-documents/magna-carta/images/after-restoration-l.jpg",
                        "caption": "A copy of Magna Carta from 1297.",
                        "credit": "Credit: Wikimedia https://www.archives.gov/exhibits/featured-documents/magna-carta"
                    },
                    "start_date": {
                        "year": "1215"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "Magna Carta, 1215",
                        "text": "<p>In 1215, King John signed Magna Carta (the Great Charter) in response to the demands of rebellious barons, although it ultimately failed to resolve their conflict. The document had to be reissued frequently after his death.</p><p>Magna Carta was written to protect the interests of the nobility against tyranny by the king, although it actually solidified gains in royal authority acquired by John's father Henry II. However, many of its principles of justice became embeded in English law and later served as the inspiration for the American Constitution and Bill of Rights.</p>"
                    }
                }, {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/2/21/Battle-poitiers%281356%29.jpg",
                        "caption": "The Battle of Poitier, 1356.",
                        "credit": "Credit: Wikimedia https://en.wikipedia.org/wiki/Battle_of_Poitiers"
                    },
                    "start_date": {
                        "year": "1337"
                    },
                    "end_date": {
                        "year": "1453"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "The Hundred Years War, 1337-1453",
                        "text": "<p>In the 1330s, tensions grew around English possessions in France, for which they were technically vassals of the French king. Edward III, whose grandfather was King Louis of France, eventually claimed the French throne, provoking on and off conflicts between the English and French for a little over a century. Initial English successes began to wane at the end of the 1370s during the end of Edward's reign.</p><p>Renewed English successes took place under Henry V in the first quarter of the fifteenth century, including the famous victory at Agincourt in 1415. The tide began to turn in the late 1420s when the French were inspired by Joan of Arc. The English gradually lost ground, and by the end of the 1450s retained possession only of the port of Calais in Normandy.</p>"
                    }
                }, {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/66/Chaucer_Hoccleve.png/450px-Chaucer_Hoccleve.png",
                        "caption": "Portrait of Chaucer from a 1412 manuscript by Thomas Hoccleve",
                        "credit": "Credit: Wikimedia https://en.wikipedia.org/wiki/File:Chaucer_Hoccleve.png"
                    },
                    "start_date": {
                        "year": "1343"
                    },
                    "end_date": {
                        "year": "1400"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "Geoffrey Chaucer, c1340s - 1400",
                        "text": "<p>Dubbed \"the Father of English poetry\" in the seventeenth century, Chaucer is the most famous of a group of \"Ricardian\" poets (associated with the reign of Richard II) that also included William Langland and the poet of <em>Sir Gawain and the Green Knight</em>. Chaucer's most famous poems are <em>The Canterbury Tales</em> and <em>Troilus and Criseyde</em>.</p><p>Renewed English successes took place under Henry V in the first quarter of the fifteenth century, including the famous victory at Agincourt in 1415. The tide began to turn in the late 1420s when the French were inspired by Joan of Arc. The English gradually lost ground, and by the end of the 1450s retained possession only of the port of Calais in Normandy.</p>"
                    }
                }, {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a1/King_Richard_III_from_NPG.jpg/800px-King_Richard_III_from_NPG.jpg",
                        "caption": "Richard III",
                        "credit": "Credit: Wikimedia https://en.wikipedia.org/wiki/Wars_of_the_Roses#/media/File:King_Richard_III_from_NPG.jpg"
                    },
                    "start_date": {
                        "year": "1455"
                    },
                    "end_date": {
                        "year": "1487"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "The Wars of the Roses, 1455-1487",
                        "text": "<p>The Wars of the Roses were a series of English civil wars for control of the throne of England fought between supporters of two rival cadet branches of the royal House of Plantagenet: the House of Lancaster, represented by a red rose, and the House of York, represented by a white rose (Wikipedia). After Richard III, the last Yorkist king was killed at Bosworth Field in 1485, the Lancastrian heir, Henry Tudor, married Elizabeth of York, re-uniting the two houses. Henry ascended the throne as Henry VII, beginning the Tudor dynasty.</p>"
                    }
                }, {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/Caxton%27s_Canterbury_Tales.jpg/330px-Caxton%27s_Canterbury_Tales.jpg",
                        "caption": "Caxton's 1476 edition of Chaucer's <em>Canterbury Tales</em>",
                        "credit": "Credit: Wikimedia https://en.wikipedia.org/wiki/File:Caxton%27s_Canterbury_Tales.jpg"
                    },
                    "start_date": {
                        "year": "1476"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "William Caxton opens the first print shop in London, 1476",
                        "text": "<p>Caxton was not the inventor of the printing press, but he was the first to open a print shop in England. The very first book he is known to have published is an edition of Chaucer <em>Canterbury Tales</em>. Caxton's print shop marks the beginning of the rise of print culture.</p>"
                    }
                }, {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/After_Hans_Holbein_the_Younger_-_Portrait_of_Henry_VIII_-_Google_Art_Project.jpg/330px-After_Hans_Holbein_the_Younger_-_Portrait_of_Henry_VIII_-_Google_Art_Project.jpg",
                        "caption": "Portrait of Henry VIII after Hans Holbein the Younger, c. 1537–1547",
                        "credit": "Credit: Wikimedia https://en.wikipedia.org/wiki/File:After_Hans_Holbein_the_Younger_-_Portrait_of_Henry_VIII_-_Google_Art_Project.jpg"
                    },
                    "start_date": {
                        "year": "1517"
                    },
                    "end_date": {
                        "year": "1648"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "The Reformation, 1517-1648",
                        "text": "<p>During the Middle Ages, the Church had split between eastern and western branches, but this split was never fully acknowledged, and there were repeated attempts to re-unite them. These attempts were not successful, and the two branches gave rise to what we today call Eastern Orthodox Christianity and Catholicism (descended from the western branch).</p><p>Within Western Christianity, the doctrinal and political superiority of Church was challenged during the sixteenth century, and various sects split off from the Catholic Church. This movement gave rise to a diverse set of doctrines and practices that are grouped today under the term Protestantism. Lutheranism and Presbyterian are examples of Protestant denominations that developed early in the process.</p><p>Protestantism came to England in 1534 amidst Henry VIII's concerns over the succession to the throne. He dissolved the monasteries and made himself head of the Church of England, creating the English brand of Protestantism, known as Anglicanism. The American branch is called Episcopaleanism.</p>"
                    }
                }, {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/a/af/Darnley_stage_3.jpg/330px-Darnley_stage_3.jpg",
                        "caption": "The \"Darnley Portrait\" of Elizabeth I, c. 1575",
                        "credit": "Credit: Wikimedia https://en.wikipedia.org/wiki/File:Darnley_stage_3.jpg"
                    },
                    "start_date": {
                        "year": "1558"
                    },
                    "end_date": {
                        "year": "1603"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "Elizabeth I, 1558-1603",
                        "text": "<p>During the reign of Elizabeth I England saw a flowering of the cultural characteristics associated with the Renaissance, and England began to involve itself with the opening up of the Americas (mostly through attacks on Spanish ships at this stage &mdash; colonisation would begin a few years after her death at Jamestown, VA). The Church of England much more secure as the state religion. Literary giants such as Shakespeare and Marlowe flourished in the London theatre scene.</p><p>Elizabeth was the last Tudor monarch. She died without a direct heir, and the throne passed to her cousin James Stuart of Scotland, who became James VI of Scotland and James I of England. This began the Stuart dynasty.</p>"
                    }
                }, {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/King_Charles_I_after_original_by_van_Dyck.jpg/255px-King_Charles_I_after_original_by_van_Dyck.jpg",
                        "caption": "Charles I, painted by Anthony Van Dyck, c. 1636",
                        "credit": "Credit: Wikimedia https://en.wikipedia.org/wiki/File:King_Charles_I_after_original_by_van_Dyck.jpg"
                    },
                    "start_date": {
                        "year": "1642"
                    },
                    "end_date": {
                        "year": "1651"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "The English Civil War, 1642-1651",
                        "text": "<p>The end of the sixteenth and early seventeenth centuries saw the development of absolute monarchies across Europe, along with a growing Protestant political power base. In England, Calvinist Protestants, known as Puritans, vied with the Established Church of England, influencing its doctrines and, starting in the mid-seventeenth century, obtaining increasing representation in Parliament. The conflict between these two developments led England into a civil war in which the king, Charles I, was executed.</p><p>During the interregnum, Parliamentary forces failed to maintain their unity, and there was considerable discontent at the religious edicts of the Puritans. In 1660, Charles's son Charles II was restored to the throne with the requirement that he rule as a Protestant and that his authority was subject to Parliament. The reign of Charles II is known as the Restoration period.</p>"
                    }
                }, {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b6/Great_Fire_London.jpg/750px-Great_Fire_London.jpg",
                        "caption": "The Great Fire of London, depicted by an unknown painter (1675), as it would have appeared from a boat in the vicinity of Tower Wharf on the evening of Tuesday, 4 September 1666. To the left is London Bridge; to the right, the Tower of London. Old St Paul's Cathedral is in the distance, surrounded by the tallest flames.",
                        "credit": "Credit: Wikimedia https://en.wikipedia.org/wiki/File:Great_Fire_London.jpg"
                    },
                    "start_date": {
                        "year": "1666"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "The Great Fire of London, 1666",
                        "text": "<p>In 1666 a fire broke out at a bakery on Pudding Lane. The fire spread throughout much of London, destroying much of its medieval infrastructure. Whilst the losses were immeasurable, the re-building process encouraged a new perspective on art and society, embracing ideas that had developed during the Renaissance and fusing them with the growing intellectual climate of the Englightenment.</p><p>As England's power grew, especially through the dominance of its navy and its growing colonial activities, Charles II was sometimes compared to the Roman Emperor Augustus. For this reason, the artistic works of the period are sometimes known as Augustan poetry or Augustine art.</p>"
                    }
                }, {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b6/The_Blue_Boy.jpg/450px-The_Blue_Boy.jpg",
                        "caption": "Thomas Gainsborough, The Blue Boy, c. 1770, in the Henry E. Huntington Art Gallery, San Marino, CA",
                        "credit": "Credit: Wikimedia https://en.wikipedia.org/wiki/File:The_Blue_Boy.jpg"
                    },
                    "start_date": {
                        "year": "1660"
                    },
                    "end_date": {
                        "year": "1800"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "The Enlightment, 1660",
                        "text": "<p>The Enlightenment (also known as the Age of Reason) was an intellectual and philosophical movement in Europe during the seventeenth and eighteenth centuries. The dates of the Enlightenment vary; the ones given here use the Restoration of the monarchy in 1660 as a starting point and uses the beginning of the nineteenth century as a rough ending point.</p><p>Characteristic of the Englightenment was the wide circulation of ideas in print, as well as through meetings of organisations such as scientific academies and at gatherings in literary salons and coffeehouses. The Enlightenment inherited Renaissance neoclassical aesthetics but married them to a principles of rationality and empiricism, alongside challenges to established religious and political authorities.</p>"
                    }
                },
                {
                    "media": {
                        "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5d/Eug%C3%A8ne_Delacroix_-_Le_28_Juillet._La_Libert%C3%A9_guidant_le_peuple.jpg/1024px-Eug%C3%A8ne_Delacroix_-_Le_28_Juillet._La_Libert%C3%A9_guidant_le_peuple.jpg",
                        "caption": "Eugène Delacroix, <em>La Liberté guidant le peuple</em>, 1830",
                        "credit": "Credit: Wikimedia https://en.wikipedia.org/wiki/French_Revolution#/media/File:Eug%C3%A8ne_Delacroix_-_Le_28_Juillet._La_Libert%C3%A9_guidant_le_peuple.jpg"
                    },
                    "start_date": {
                        "year": "1789"
                    },
                    "display_date": "",
                    "text": {
                        "headline": "The French Revolution, 1789",
                        "text": "<p>The French Revolution is often taken as a milestone of the emergence of modernity, a sweeping away of the last vestiges of the Ancien Régime (\"old rule\"), the political and social institutions inherited from the Middle Ages. Whilst this is perhaps an overstatement of its significance, we can already see in Delacroix's depiction some 40 year later the cultural transition from the Age of Enlightenment to the new spirit of Romanticism, which would be followed by the Industrial Revolution.</p>"
                    }
                }
