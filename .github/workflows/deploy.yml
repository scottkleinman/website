name: Build and Deploy Zensical Site via FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Fetch the latest code from your repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Install uv and link the automatic cache to your lockfile
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      # Step 3: Run Zensical build strictly using pinned versions
      - name: Build Static Site
        run: uv run --frozen zensical build

      # Step 4: Deploy new or modified files over Secure FTPS
      - name: Sync Build Folder via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 990 # Standard secure FTPS port
          security: ftps # Forces the runner to use encrypted TLS security mechanisms
          local-dir: ./site/
          server-dir: public_html/testsite/

