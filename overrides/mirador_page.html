{% extends "main.html" %}

{% block extrahead %}

{{ super() }}
<style>
  .md-sidebar .md-sidebar--secondary {
    display: none !important;
  }
  /*
    Hides the first H1 header element inside the main body block.
    This strips the title automatically whenever this template is called.
  */
  .md-content h1:first-of-type {
    display: none !important;
  }

  /* Expand the main Zensical text area to fill the layout horizontally */
  .md-content {
    max-width: 100% !important;
  }

  /* Make the workspace container completely fluid */
  #mirador-container {
    position: relative;
    width: 100%;
    height: 75vh;
    min-height: 600px;
    border: 1px solid var(--md-default-fg-color--leftover, #e0e0e0);
    border-radius: 4px;
    overflow: hidden;
    /* Uncomment if you only want to hide the TOC sidebar
    margin: 1.5rem 0;
    */

  }
</style>
{% endblock %}

{% block content %}
{{ super() }}

<div id="mirador-container"></div>

<script type="text/javascript">
  // Catalogue
  const catalog = [
    {
      manifestId:
        "https://hdl.huntington.org//iiif/info/p15150coll7/2838/manifest.json",
      provider: "The Henry E. Huntington Library",
    },
    {
      manifestId: "https://damsssl.llgc.org.uk/iiif/2.0/4628556/manifest.json",
      provider: "The National Library of Wales",
    },
    {
      manifestId: "https://iiif.lib.harvard.edu/manifests/drs:48309543",
      provider: "Harvard University",
    },
    {
      manifestId:
        "https://api.bl.uk/metadata/iiif/ark:/81055/vdc_100054581994.0x000001/manifest.json",
      provider: "The British Library",
    },
    {
      manifestId:
        "https://api.bl.uk/metadata/iiif/ark:/81055/vdc_100054605479.0x000001/manifest.json",
      provider: "The British Library",
    },
    {
      manifestId:
        "https://www.e-codices.unifr.ch/metadata/iiif/fmb-cb-0048/manifest.json",
      provider: "e-codices",
    },
    {
      manifestId:
        "https://iiif.bodleian.ox.ac.uk/iiif/manifest/34f8370b-15d7-435e-8a83-ad6803dd05cd.json",
      provider: "Bodleian Libraries, University of Oxford",
    },
    {
      manifestId:
        "https://iiif.bodleian.ox.ac.uk/iiif/manifest/b793b75b-1888-4f3c-8031-437cd0b9fae2.json",
      provider: "Bodleian Libraries, University of Oxford",
    },
    {
      manifestId: "https://iiif.lib.harvard.edu/manifests/drs:48309543",
      provider: "Harvard University",
    },
    {
      manifestId:
        "https://iiif.bodleian.ox.ac.uk/iiif/manifest/390fd0e8-9eae-475d-9564-ed916ab9035c.json",
      provider: "Bodleian Libraries",
    },
    {
      manifestId:
        "https://dms-data.stanford.edu/data/manifests/Parker/qd527zm3425/manifest.json",
      provider: "Parker Online",
    },
    {
      manifestId:
        "https://dms-data.stanford.edu/data/manifests/Parker/wd443nz9456/manifest.json",
      provider: "Parker Online",
    },
    {
      manifestId:
        "https://dms-data.stanford.edu/data/manifests/Parker/qd527zm3425/manifest.json",
      provider: "Parker Online",
    },
    {
      manifestId:
        "https://iiif.bodleian.ox.ac.uk/iiif/manifest/c5438c30-71dd-4cec-ac59-eb1e5a11f2a4.json",
      provider: "Bodleian Libraries",
    },
    {
      manifestId:
        "https://iiif.bodleian.ox.ac.uk/iiif/manifest/90a06f70-880a-4b5b-bd30-798710afff11.json",
      provider: "Bodleian Libraries",
    },
  ];

    document.addEventListener("DOMContentLoaded", function() {
      // 1. Ingest defaults natively generated by Zensical from markdown front-matter
      let rawManifests = [];
      {% if page.meta.manifests %}
        rawManifests = {{ page.meta.manifests | tojson }};
      {% elif page.meta.manifest %}
        rawManifests = [{{ page.meta.manifest | tojson }}];
      {% endif %}

      // 2. Extract configuration arrays from URL Parameters if they exist
      const urlParams = new URLSearchParams(window.location.search);
      const urlManifestsParam = urlParams.get('manifest') || urlParams.get('id');
      const urlCanvasParam = urlParams.get('canvasIndex') || urlParams.get('canvas');
      const urlThumbParam = urlParams.get('thumbnailNavigationPosition') || urlParams.get('thumbnail');

      let finalManifests = [];

      // 3. Resolve incoming targets: URL overrides take top priority over Front-Matter
      if (urlManifestsParam) {
        const manifestsArray = urlManifestsParam.split(',').map(u => u.trim());
        const canvasArray = urlCanvasParam ? urlCanvasParam.split(',').map(c => parseInt(c.trim(), 10) || 0) : [];
        const thumbArray = urlThumbParam ? urlThumbParam.split(',').map(t => t.trim()) : [];

        finalManifests = manifestsArray.map((url, index) => {
          return {
            url: url,
            canvasIndex: canvasArray[index] !== undefined ? canvasArray[index] : 0,
            thumbnailNavigationPosition: thumbArray[index] !== undefined ? thumbArray[index] : 'bottom'
          };
        });
      } else {
        // Fallback to front matter format normalizing items into consistent data structures
        finalManifests = rawManifests.map((item) => {
          if (typeof item === 'string') {
            return { url: item, canvasIndex: 0, thumbnailNavigationPosition: 'bottom' };
          }
          return {
            url: item.url || item.manifestId,
            canvasIndex: item.canvasIndex !== undefined ? parseInt(item.canvasIndex, 10) : 0,
            thumbnailNavigationPosition: item.thumbnailNavigationPosition || 'bottom'
          };
        });
      }

      // 4. Map settings directly to unique Mirador window workspace models
      const windowsConfig = finalManifests.map((config) => {
        return {
          manifestId: config.url,
          loadedManifest: config.url,
          canvasIndex: config.configCanvasIndex ?? config.canvasIndex,
          thumbnailNavigationPosition: config.thumbnailNavigationPosition
        };
      });

      // 5. Build layout
      const miradorInstance = Mirador.viewer({
        id: 'mirador-container',
        catalog: catalog,
        windows: windowsConfig,
        window: {
          allowClose: true,
          allowMaximize: true,
          sideBarPanel: 'info',
          defaultSidebarPanelOpen: false,
          views: [
            { key: 'single' },
            { key: 'book' },
            { key: 'gallery' }
          ]
        },
        workspace: {
          showZoomControls: true,
          type: 'mosaic'
        }
      });
    });
</script>
{% endblock %}
